[package]
name = "shor"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Classical state-vector quantum-circuit simulator: Shor's algorithm substrate"

[dependencies]
num-complex = "0.4"
rand = "0.10"
rand_chacha = "0.10"

[dev-dependencies]
proptest = "1"
rho = { path = "../rho" }
shared-field = { path = "../shared/field" }
crypto-bigint = { version = "0.7", features = ["rand_core"] }

[lints]
workspace = true
