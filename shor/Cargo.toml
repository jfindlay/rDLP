[package]
name = "shor"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Classical state-vector quantum-circuit simulator: Shor's algorithm substrate"

[dependencies]
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1"
rho = { path = "../rho" }
shared-field = { path = "../shared/field" }
crypto-bigint = { version = "0.5", features = ["rand_core"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = "warn"
